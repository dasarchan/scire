name: Release
on:
  release:
    types: [published]
permissions:
  contents: write
concurrency:
  group: release-latest
  cancel-in-progress: false
jobs:
  latest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.11'
      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          uv run python - <<'PY'
          import os
          from scire import __version__
          assert os.environ['RELEASE_TAG'] == 'v' + __version__, 'Release tag must match package version'
          PY
      - run: uv sync --locked --group dev
      - run: uv run pytest -q
      - run: uv build
      - name: Advance installation branch
        run: git push origin HEAD:refs/heads/latest
