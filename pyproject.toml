[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "scire-local"
version = "0.1.8"
description = "Keep your understanding of a codebase current"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "fastapi>=0.115,<1",
 "uvicorn>=0.32,<1",
 "pydantic>=2.9,<3",
 "httpx>=0.27,<1",
 "pathspec>=0.12,<1",
 "markdown-it-py>=3,<5",
 "json5>=0.9,<1",
 "questionary>=2.1,<3",
]

[project.scripts]
scire = "scire.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "playwright>=1.48,<2", "ruff>=0.8,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/scire"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 110
