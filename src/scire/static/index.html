<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#101216" />
    <title>Scire — Keep the code in mind</title>
    <link rel="stylesheet" href="/static/app.css" />
    <script type="module" src="/static/app.js"></script>
  </head>
  <body>
    <header>
      <a class="wordmark" href="/"
        >S<span class="brand-line"></span>cire<span class="local-tag"
          >LOCAL</span
        ></a
      ><button
        id="nav-toggle"
        aria-label="Collapse sidebar"
        aria-expanded="true"
      >
        ☰
      </button>
      <div class="repo-switcher">
        <button
          id="repo-menu"
          aria-haspopup="listbox"
          aria-expanded="false"
          aria-controls="repo-options"
        >
          <svg
            viewBox="0 0 20 20"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            aria-hidden="true"
          >
            <path d="M2.5 6V4.5h5l2 2h8v9h-15z" />
          </svg>
          <span id="repo-label">All repositories</span>
          <svg
            class="repo-chevron"
            viewBox="0 0 16 16"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            aria-hidden="true"
          >
            <path d="m4 6 4 4 4-4" />
          </svg>
        </button>
        <div id="repo-dropdown" hidden>
          <label class="repo-search"
            ><svg
              viewBox="0 0 20 20"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              aria-hidden="true"
            >
              <circle cx="8.5" cy="8.5" r="5.5" />
              <path d="m13 13 4 4" /></svg
            ><input
              id="repo-filter"
              type="search"
              placeholder="Find a repository…"
              aria-label="Find a repository"
              autocomplete="off"
              spellcheck="false"
          /></label>
          <div id="repo-options" role="listbox" aria-label="Repositories"></div>
          <div class="repo-dropdown-footer">
            <span id="repo-count"></span
            ><button id="repo-settings">
              Manage connections <span aria-hidden="true">↗</span>
            </button>
          </div>
        </div>
      </div>
      <div class="top-actions">
        <span class="connection"><i></i>Local workspace</span
        ><button id="profile-badge" aria-label="Profile">A</button>
      </div>
    </header>
    <div class="layout">
      <aside id="nav">
        <div class="nav-label">WORKSPACE</div>
        <button data-view="home" class="selected">
          ◫ <span>Overview</span></button
        ><button data-view="knowledge">⌘ <span>Knowledge</span></button>
        <div id="session-nav" class="session-nav"></div>
        <div class="nav-bottom">
          <button data-view="settings">⚙ <span>Settings</span></button
          ><small>Your learning stays on this machine.</small>
        </div>
      </aside>
      <main id="main">
        <p class="eyebrow">YOUR UNDERSTANDING, UP TO DATE</p>
        <h1>Keep the code in mind.</h1>
        <p class="subtitle">
          Build a working model of your codebase. Make the next change with
          confidence.
        </p>
        <div id="content"></div>
      </main>
    </div>
    <div id="toast" role="status" hidden></div>
    <dialog id="modal"></dialog>
  </body>
</html>
