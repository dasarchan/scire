<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#101216" />
    <title>Scire</title>
    <link rel="stylesheet" href="/static/app.css" />
    <link rel="stylesheet" href="/static/onboarding.css" />
    <script type="module" src="/static/app.js"></script>
  </head>
  <body data-loading>
    <header>
      <a class="wordmark" href="/">Scire</a
      ><button
        id="nav-toggle"
        aria-label="Collapse sidebar"
        aria-expanded="true"
      >
        <svg
          viewBox="0 0 20 20"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          aria-hidden="true"
        >
          <path d="M4 5h12M4 10h12M4 15h12" />
        </svg>
      </button>
      <div class="repo-switcher">
        <button
          id="repo-menu"
          aria-haspopup="listbox"
          aria-expanded="false"
          aria-controls="repo-options"
        >
          <svg
            viewBox="0 0 20 20"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            aria-hidden="true"
          >
            <path d="M2.5 6V4.5h5l2 2h8v9h-15z" />
          </svg>
          <span id="repo-label">All repositories</span>
          <svg
            class="repo-chevron"
            viewBox="0 0 16 16"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            aria-hidden="true"
          >
            <path d="m4 6 4 4 4-4" />
          </svg>
        </button>
        <div id="repo-dropdown" hidden>
          <label class="repo-search"
            ><svg
              viewBox="0 0 20 20"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              aria-hidden="true"
            >
              <circle cx="8.5" cy="8.5" r="5.5" />
              <path d="m13 13 4 4" /></svg
            ><input
              id="repo-filter"
              type="search"
              placeholder="Find a repository…"
              aria-label="Find a repository"
              autocomplete="off"
              spellcheck="false"
          /></label>
          <div id="repo-options" role="listbox" aria-label="Repositories"></div>
          <div class="repo-dropdown-footer">
            <span id="repo-count"></span
            ><button id="repo-settings">
              Manage connections <span aria-hidden="true">↗</span>
            </button>
          </div>
        </div>
      </div>
      <div class="top-actions">
        <button id="profile-badge" aria-label="Profile">A</button>
      </div>
    </header>
    <div class="layout">
      <aside id="nav">
        <button data-view="home" class="selected">
          <svg
            viewBox="0 0 20 20"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            aria-hidden="true"
          >
            <rect x="3" y="3" width="5" height="5" rx="1" />
            <rect x="12" y="3" width="5" height="5" rx="1" />
            <rect x="3" y="12" width="5" height="5" rx="1" />
            <rect x="12" y="12" width="5" height="5" rx="1" />
          </svg>
          <span>Overview</span></button
        ><button data-view="knowledge">
          <svg
            viewBox="0 0 20 20"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            aria-hidden="true"
          >
            <path
              d="M10 5C7 3 4 3 2 4v12c3-1 5-1 8 1 3-2 5-2 8-1V4c-2-1-5-1-8 1Zm0 0v12"
            />
          </svg>
          <span>Knowledge</span>
        </button>
        <div id="session-nav" class="session-nav"></div>
        <div class="nav-bottom">
          <button data-view="settings">
            <svg
              viewBox="0 0 20 20"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              aria-hidden="true"
            >
              <path
                d="m8 2-.5 2-1.7 1-2-.5-2 3 1.5 1.5v2L2 12.5l2 3 2-.5 1.7 1 .5 2h3.5l.5-2 1.7-1 2 .5 2-3-1.5-1.5v-2L18 8l-2-3-2 .5-1.7-1-.5-2Z"
              />
              <circle cx="10" cy="10" r="2.5" />
            </svg>
            <span>Settings</span>
          </button>
        </div>
      </aside>
      <main id="main">
        <h1>Overview</h1>
        <p class="subtitle" hidden></p>
        <div id="content"></div>
      </main>
    </div>
    <div id="toast" role="status" hidden></div>
    <dialog id="modal"></dialog>
  </body>
</html>
